<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central Ohio Safety Assistant</title>
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --red:#cc0000; --red-hover:#a30000; --red-soft:#fdf1f1; --red-line:#f2d4d4;
  --bg:#fbfaf9; --panel:#ffffff; --panel-2:#f5f3f1;
  --ink:#16161a; --ink-2:#3d3d44; --muted:#71717a; --line:#e6e3e0;
  --good:#1a6b45; --warn:#8a5500; --warn-soft:#fdf5e7;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px -12px rgba(0,0,0,.14);
  --font:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --red:#ff5a5a; --red-hover:#ff7b7b; --red-soft:#2a1618; --red-line:#4a2226;
  --bg:#121214; --panel:#1b1b1e; --panel-2:#232327;
  --ink:#ededf0; --ink-2:#c6c6cc; --muted:#98989f; --line:#2f2f34;
  --good:#6cc79a; --warn:#e3b164; --warn-soft:#2b2214;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.65 var(--font);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  transition:background .2s ease,color .2s ease;
}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:0 20px}

/* ---------------------------------------------------------------- header */
header{
  border-bottom:1px solid var(--line);background:var(--panel);
  opacity:0;transform:translateY(-6px);pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
}
body.chatting header{opacity:1;transform:none;pointer-events:auto}
.hbar{display:flex;align-items:center;gap:12px;padding:11px 0}
.mark{width:26px;height:26px;border-radius:7px;background:var(--red);
  display:grid;place-items:center;flex:none}
.mark svg{width:76%;height:76%;display:block}
.htitle{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.hstatus{font-size:11.5px;color:var(--muted);margin-top:1px}
.spacer{flex:1}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--muted);
  width:32px;height:32px;border-radius:9px;cursor:pointer;display:grid;
  place-items:center;font-size:14px;transition:.15s}
.iconbtn:hover{color:var(--red);border-color:var(--red)}

/* --------------------------------------------------------------- landing */
#landing{flex:1;display:flex;flex-direction:column;justify-content:center;
  align-items:center;padding:40px 0 64px;gap:26px}
body.chatting #landing{display:none}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.hero .mark{width:46px;height:46px;border-radius:13px}
.hero .mark svg{width:72%;height:72%}
.hero h1{margin:0;font-size:29px;font-weight:600;letter-spacing:-.025em;line-height:1.25}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{margin:0;color:var(--muted);font-size:14.5px;max-width:520px}
.landing-top{position:absolute;top:0;right:0;padding:16px 20px;z-index:2}
body.chatting .landing-top{display:none}

/* ---------------------------------------------------------------- thread */
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
#thread{padding-top:26px;padding-bottom:24px;display:none}
body.chatting #thread{display:block}
.msg{margin-bottom:26px;animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.who{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:7px}
.who::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line)}
.msg.assistant .who::before{background:var(--red)}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 17px;overflow-wrap:anywhere;color:var(--ink-2)}
.answer{white-space:pre-wrap}
.msg.user .bubble{background:var(--red-soft);border-color:var(--red-line);color:var(--ink)}
:root[data-theme="dark"] .msg.user .bubble{color:var(--ink)}

.cite{color:var(--red);font-weight:650;font-size:12px;cursor:pointer;
  text-decoration:none;padding:0 1px;vertical-align:.08em}
.cite:hover{text-decoration:underline}
.unsupported{background:var(--warn-soft);color:var(--warn);border-radius:5px;
  padding:1px 6px;font-size:11.5px;font-weight:650}

.progress{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);
  margin-top:12px}
.answer:empty + .progress{margin-top:0}
.progress .elapsed{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12px}
.spin{width:13px;height:13px;border-radius:50%;flex:none;
  border:2px solid var(--line);border-top-color:var(--red);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.reading{font-size:12px;color:var(--muted);margin-top:5px;padding-left:22px}
.note{margin-top:12px;font-size:13px;color:var(--warn);background:var(--warn-soft);
  border-radius:var(--radius-sm);padding:8px 11px;white-space:normal}
.answer:empty + .note{margin-top:0}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.msg{animation:none}}

.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.badge{font-size:11px;padding:2.5px 9px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);background:var(--panel-2)}
.badge.good{color:var(--good);border-color:currentColor;background:transparent}
.badge.warn{color:var(--warn);border-color:currentColor;background:transparent}
details{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:650;
  list-style:none;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--red)}
details[open] summary::before{content:"▾ "}
.src{font-size:12.5px;padding:9px 0;border-bottom:1px dashed var(--line);
  transition:background .3s}
.src:last-child{border-bottom:0}
.src .n{color:var(--red);font-weight:700;margin-right:6px}
.src .meta{color:var(--muted);font-size:11.5px;margin-top:2px}
.src a{color:var(--red);word-break:break-all;opacity:.85}
.src.flash{background:var(--red-soft);border-radius:8px;padding-left:9px;padding-right:9px}

/* -------------------------------------------------------------- composer */
#composer-slot{width:100%}
/* The composer is a sibling of the scroll area, not inside it, so it stays
   pinned to the bottom of the viewport however short the thread is. */
#dock-outer{display:none;flex:none;background:var(--bg);border-top:1px solid var(--line);
  padding:13px 0 16px}
body.chatting #dock-outer{display:block}
.composer{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:11px 12px 10px;transition:border-color .15s}
.composer:focus-within{border-color:var(--red)}
.crow{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;font:inherit;border:0;background:transparent;color:var(--ink);
  padding:4px 2px;max-height:170px;outline:none;line-height:1.55}
textarea::placeholder{color:var(--muted)}
.send{background:var(--red);color:#fff;border:0;border-radius:9px;width:34px;height:34px;
  cursor:pointer;flex:none;display:grid;place-items:center;transition:.15s;font-size:15px}
.send:hover:not(:disabled){background:var(--red-hover)}
.send:disabled{opacity:.35;cursor:default}
.send.stop{background:var(--ink-2);font-size:11px}
.send.stop:hover{background:var(--ink)}
.landing-status{font-size:12px;color:var(--muted);margin:2px 0 0}
.hint{font-size:11px;color:var(--muted);margin-top:7px;padding-left:2px}
.hrow{display:flex;align-items:center;gap:10px;margin-top:7px}
.hrow .hint{margin-top:0;flex:1}
.who{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.who select{font:inherit;font-size:11.5px;color:var(--ink-2);background:var(--panel-2);
  border:1px solid var(--line);border-radius:7px;padding:3px 6px;max-width:260px;cursor:pointer}
.who select:focus{outline:none;border-color:var(--red)}
.src .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--warn);background:var(--warn-soft);
  border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}

/* ------------------------------------------------------------ suggestions */
.suggest{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%}
@media(min-width:900px){.suggest{grid-template-columns:1fr 1fr 1fr}}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:12px 13px;cursor:pointer;font:inherit;
  font-size:12.8px;color:var(--ink-2);line-height:1.42;transition:.15s}
.card:hover{border-color:var(--red);color:var(--ink);transform:translateY(-1px)}
.card .tag{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--red);margin-bottom:4px}
@media(max-width:640px){
  .suggest{grid-template-columns:1fr}
  .hero h1{font-size:24px}
  .wrap{padding:0 16px}
}
</style>
</head>
<body class="landing">

<header><div class="wrap hbar">
  <div class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12h21M12 1.5v21" stroke="#fff" stroke-opacity=".34" stroke-width="8.5" stroke-linecap="round"/><path d="M3 12h2.6M8.2 12h2.2M13.6 12h2.2M18.4 12h2.6" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><path d="M12 3v2.6M12 8.2v2.2M12 13.6v2.2M12 18.4v2.6" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg></div>
  <div>
    <div class="htitle">Central Ohio Safety Assistant</div>
    <div class="hstatus" id="status">connecting…</div>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" id="newchat" title="New conversation">✎</button>
  <button class="iconbtn" id="theme" title="Toggle theme">◐</button>
</div></header>

<div class="landing-top"><button class="iconbtn" id="theme2" title="Toggle theme">◐</button></div>

<div id="main">
  <div id="landing"><div class="wrap" style="display:flex;flex-direction:column;gap:26px;align-items:center">
    <div class="hero">
      <div class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12h21M12 1.5v21" stroke="#fff" stroke-opacity=".34" stroke-width="8.5" stroke-linecap="round"/><path d="M3 12h2.6M8.2 12h2.2M13.6 12h2.2M18.4 12h2.6" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><path d="M12 3v2.6M12 8.2v2.2M12 13.6v2.2M12 18.4v2.6" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg></div>
      <h1>Transportation safety,<br><em>grounded in Central Ohio</em></h1>
      <p id="landing-sub">Ask about crashes, corridors, speed, growth or local plans. Every
        claim is cited to a local document, and the answer says what the evidence doesn't cover.</p>
      <p class="landing-status" id="landing-status">Loading the knowledge base…</p>
    </div>
    <div id="composer-slot"></div>
    <div class="suggest" id="suggest"></div>
  </div></div>

  <div class="wrap" id="thread"></div>
</div>

<div id="dock-outer"><div class="wrap" id="dock"></div></div>

<!-- the composer is moved between the landing slot and the dock -->
<template id="composer-tpl">
  <div class="composer">
    <div class="crow">
      <textarea id="q" rows="1" placeholder="Ask about transportation safety in Columbus or Central Ohio…"></textarea>
      <button class="send" id="send" title="Send" aria-label="Send">↑</button>
    </div>
    <div class="hrow">
      <div class="hint" id="hint">Enter to send · Shift+Enter for a new line</div>
      <label class="who" title="Frame the answer and its metrics for one stakeholder group">
        Perspective
        <select id="who"><option value="">auto-detect from question</option></select>
      </label>
    </div>
  </div>
</template>

<script>
/* ------------------------------------------------------------------ theme */
const root = document.documentElement;
const stored = (() => { try { return localStorage.getItem('cbrag-theme'); } catch(e){ return null; } })();
const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
setTheme(stored || (systemDark ? 'dark' : 'light'));
function setTheme(t){
  root.setAttribute('data-theme', t);
  try { localStorage.setItem('cbrag-theme', t); } catch(e){}
  document.querySelectorAll('#theme,#theme2').forEach(b => {
    b.textContent = t === 'dark' ? '☀' : '◐';
    b.title = t === 'dark' ? 'Switch to light' : 'Switch to dark';
  });
}
document.querySelectorAll('#theme,#theme2').forEach(b =>
  b.onclick = () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

/* ------------------------------------------------------------ suggestions */
// [tag, question, stakeholder id or null]. A stakeholder sets the Perspective
// selector before asking; null leaves it on auto-detect.
const EXAMPLES = [
  ["Current issues", "What transportation safety issues are currently receiving attention in Columbus and Central Ohio?", null],
  ["Trends", "How have transportation safety trends in Central Ohio changed over the past 5-10 years?", null],
  ["Growth", "How might projected population and employment growth change future transportation safety risks?", null],
  ["Data sources", "What different types of local data can be combined to understand transportation safety?", null],
  ["Evidence gaps", "What information is still missing before recommending a safety improvement in Columbus?", null],
  ["Trade-offs", "Where has improving safety for one road user created challenges for another?", null],
  ["Scenario · EMS", "A safety improvement project at a Columbus intersection has reduced crashes from 8 to 2 per year, but the two remaining crashes involved serious injuries. Delay has improved; pedestrian concerns remain. From the perspective of emergency responders, how would you evaluate the outcome, what concerns remain, and what evidence would you want before deciding on further action?", "emergency"],
  ["Scenario · Residents", "A safety improvement project at a Columbus intersection has reduced crashes from 8 to 2 per year, but the two remaining crashes involved serious injuries. Delay has improved; pedestrian concerns remain. From the perspective of nearby residents, how would you evaluate the outcome, what concerns remain, and what evidence would you want before deciding on further action?", "residents"],
  ["Intersection", "What is the crash history at Morse Road and Cleveland Avenue, and what should be prioritized there?", null],
  ["Freight · Rail", "Which at-grade rail crossings in Columbus / Central Ohio have safety, blocked-crossing, or trespass concerns?", "freight"],
  ["Commuters", "Where in Columbus / Central Ohio do congestion, queue spillback, or unreliable travel times affect daily commutes, and how could planned safety improvements change that?", "drivers"],
  ["Agencies · Targets", "Based on crash hotspots and roadway characteristics, which areas in Central Ohio should be prioritized for safety improvement, and is the region on track for its safety targets?", "agency"],
  ["Walking · Cycling", "Where do pedestrian or cyclist crashes cluster at crossings in Columbus, and what roadway conditions like speed, lighting, crossing distance or signal timing contribute?", "vru"]
];
const suggest = document.getElementById('suggest');
EXAMPLES.forEach(([tag, text, who]) => {
  const b = document.createElement('button');
  b.className = 'card';
  b.innerHTML = `<span class="tag"></span>`;
  b.querySelector('.tag').textContent = tag;
  b.appendChild(document.createTextNode(text));
  b.onclick = () => { whoEl.value = who || ''; qEl.value = text; ask(); };
  suggest.appendChild(b);
});

/* -------------------------------------------------------------- composer */
const slot   = document.getElementById('composer-slot');
const dock   = document.getElementById('dock');
const thread = document.getElementById('thread');
const main   = document.getElementById('main');
slot.appendChild(document.getElementById('composer-tpl').content.cloneNode(true));
const qEl = document.getElementById('q');
const sendEl = document.getElementById('send');
const whoEl = document.getElementById('who');
const STAKEHOLDER_NAMES = {};
fetch('/stakeholders').then(r => r.json()).then(j => {
  for (const st of j.stakeholders || []){
    STAKEHOLDER_NAMES[st.id] = st.name;
    const o = document.createElement('option');
    o.value = st.id; o.textContent = st.name; o.title = st.concerns.join(' · ');
    whoEl.appendChild(o);
  }
}).catch(() => {});
let busy = false, started = false;

function beginChat(){
  if (started) return;
  started = true;
  dock.appendChild(slot.firstElementChild);   // move the composer to the dock
  document.body.classList.remove('landing');
  document.body.classList.add('chatting');
  document.getElementById('hint').textContent =
    'Answers cite local documents · figures from dataset catalogues are flagged';
}
document.getElementById('newchat').onclick = () => {
  if (busy) return;
  thread.innerHTML = '';
  slot.appendChild(dock.firstElementChild);
  document.body.classList.add('landing');
  document.body.classList.remove('chatting');
  started = false;
  document.getElementById('hint').textContent = 'Enter to send · Shift+Enter for a new line';
  qEl.focus();
};

/* ---------------------------------------------------------------- health */
const landingStatus = document.getElementById('landing-status');
fetch('/health').then(r => r.json()).then(h => {
  const line = `${h.documents} sources · ${h.passages} passages · ` +
    (h.llm_available ? h.llm_model.split('/').pop() : 'no model — extractive mode');
  document.getElementById('status').textContent = line;
  // A local model takes minutes per answer; say so before anyone waits.
  landingStatus.textContent = line +
    (h.llm_available ? ' · runs locally, answers take 1–3 minutes' : '');
}).catch(() => {
  document.getElementById('status').textContent = 'server unreachable';
  landingStatus.textContent = 'Server unreachable — start it with make serve';
});

/* ------------------------------------------------------------- rendering */
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function addMsg(who, html){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerHTML = `<div class="who">${who === 'user' ? 'You' : 'Assistant'}</div>` +
                `<div class="bubble"><div class="answer">${html}</div></div>`;
  thread.appendChild(d);
  scrollDown(true);
  return {bubble: d.querySelector('.bubble'), answer: d.querySelector('.answer')};
}
// Follow the stream only while the reader is at the bottom; scrolling up to
// read earlier text should not be fought on every token.
let follow = true;
main.addEventListener('scroll', () => {
  follow = main.scrollHeight - main.scrollTop - main.clientHeight < 80;
});
const scrollDown = (force) => {
  if (force || follow) main.scrollTo({top: main.scrollHeight});
};

function linkCitations(text, id){
  return esc(text)
    .replace(/\[S(\d+)\]/g, (_, n) =>
      `<a class="cite" href="#" onclick="flash('${id}',${n});return false;">[S${n}]</a>`)
    .replace(/\[unsupported by retrieved evidence\]/g,
      '<span class="unsupported">unsupported</span>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
window.flash = (id, n) => {
  const el = document.querySelector(`#src-${id}-${n}`);
  if (!el) return;
  const d = el.closest('details'); if (d) d.open = true;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1400);
};

function renderMeta(bubble, d, id){
  const pct = v => Math.round(v * 100) + '%';
  const g = d.groundedness ?? 1, c = d.confidence ?? 0;
  const badges = [
    `<span class="badge ${g >= .9 ? 'good' : 'warn'}">grounded ${pct(g)}</span>`,
    `<span class="badge ${c >= .55 ? 'good' : 'warn'}">retrieval ${c.toFixed(2)}</span>`,
    `<span class="badge">${d.n_documents} documents</span>`,
    ...(d.stakeholder ? [`<span class="badge">for ${esc(STAKEHOLDER_NAMES[d.stakeholder] || d.stakeholder)}</span>`] : []),
    ...((d.tool_calls || []).length ? [`<span class="badge warn">${d.tool_calls.length} synthetic metric tool${d.tool_calls.length > 1 ? 's' : ''}</span>`] : []),
    `<span class="badge">${d.elapsed_s}s</span>`,
    ...(d.warnings || []).map(w => `<span class="badge warn">${esc(w)}</span>`)
  ].join('');

  const cited = (d.sources || []).filter(s => s.cited);
  const shown = cited.length ? cited : (d.sources || []);
  const list = shown.map(s => `
    <div class="src" id="src-${id}-${s.n}">
      <div><span class="n">[S${s.n}]</span>${esc(s.title)}${s.kind === 'tool_metric' ? '<span class="tag">tool output</span>' : ''}</div>
      <div class="meta">${esc(s.organization || '')}${s.locator ? ' · ' + esc(s.locator) : ''}</div>
      ${s.url ? `<div class="meta"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>` : ''}
    </div>`).join('');
  const subs = (d.subqueries || []).map(s => `<div class="meta">· ${esc(s)}</div>`).join('');

  bubble.insertAdjacentHTML('beforeend',
    `<div class="badges">${badges}</div>
     <details open><summary>Sources (${shown.length})</summary>${list}</details>
     <details><summary>How this was retrieved</summary>${subs}</details>`);
}

/* ------------------------------------------------------------------- ask */
let controller = null;

function setBusy(on){
  busy = on;
  sendEl.classList.toggle('stop', on);
  sendEl.textContent = on ? '■' : '↑';
  sendEl.title = on ? 'Stop' : 'Send';
  sendEl.setAttribute('aria-label', sendEl.title);
}

// The answer takes minutes, so the bubble always says what is happening and
// for how long, instead of an open-ended "thinking".
function progress(bubble){
  bubble.insertAdjacentHTML('beforeend',
    `<div class="progress" role="status"><span class="spin"></span>` +
    `<span class="stage">Searching local documents…</span>` +
    `<span class="elapsed">0:00</span></div><div class="reading"></div>`);
  const el = bubble.querySelector('.progress'), reading = bubble.querySelector('.reading');
  const t0 = Date.now();
  const tick = () => {
    const s = Math.floor((Date.now() - t0) / 1000);
    el.querySelector('.elapsed').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  const timer = setInterval(tick, 1000);
  let docs = 0;
  return {
    stage(d){
      const label = {
        searching: 'Searching local documents…',
        retrieved: `Found ${d.passages} passages in ${d.documents} documents`,
        writing: `Writing the answer from ${docs} documents…`,
        checking: 'Checking citations and listing evidence gaps…',
      }[d.stage];
      if (d.stage === 'retrieved'){
        docs = d.documents;
        const t = (d.titles || []).filter(x => !/^(Synthetic metric tool|Reference table):/.test(x));
        const tools = d.tools || [];
        reading.textContent = (t.length ? 'Drawing on: ' + t.slice(0, 3).join(' · ') +
          (t.length > 3 ? ` · +${t.length - 3} more` : '') : '') +
          (tools.length ? ` · metric tools: ${tools.map(x => x.replace(/_/g, ' ')).join(', ')}` : '');
      }
      if (d.stage === 'checking') reading.textContent = '';
      if (label) el.querySelector('.stage').textContent = label;
    },
    done(){ clearInterval(timer); el.remove(); reading.remove(); }
  };
}

const note = (answer, text) =>
  answer.insertAdjacentHTML('afterend', `<div class="note">${esc(text)}</div>`);

async function errorMessage(res){
  try {
    const j = await res.json();
    if (typeof j.detail === 'string') return j.detail;
    // FastAPI's own validation errors are a list; name the field that failed.
    if ((j.detail || []).some(e => (e.loc || []).includes('question')))
      return 'Please ask a longer question (at least 3 characters).';
  } catch(e){}
  return `The server returned an error (${res.status}).`;
}

async function ask(){
  const q = qEl.value.trim();
  if (!q || busy) return;
  beginChat();
  setBusy(true);
  addMsg('user', esc(q));
  qEl.value = ''; qEl.style.height = 'auto';

  const id = Date.now();
  const {bubble, answer} = addMsg('assistant', '');
  const prog = progress(bubble);
  let streamed = '', finished = false;
  controller = new AbortController();

  try{
    const res = await fetch('/ask/stream', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question:q, stakeholder: whoEl.value || null}), signal: controller.signal
    });
    if (!res.ok) throw new Error(await errorMessage(res));
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while(true){
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n\n'); buf = lines.pop();
      for (const line of lines){
        if (!line.startsWith('data:')) continue;
        const d = JSON.parse(line.slice(5));
        if (d.type === 'stage'){
          prog.stage(d);
          scrollDown();
        } else if (d.type === 'token'){
          streamed += d.text;
          answer.textContent = streamed;
          scrollDown();
        } else if (d.type === 'error'){
          throw new Error(d.message || 'The server failed while answering.');
        } else if (d.type === 'done'){
          finished = true;
          prog.done();
          // citations are verified server-side; swap in the attributed text
          answer.innerHTML = linkCitations(d.answer, id);
          renderMeta(bubble, d, id);
        }
      }
    }
    if (!finished) throw new Error('The connection closed before the answer was finished.');
  } catch(e){
    prog.done();
    if (e.name === 'AbortError'){
      note(answer, streamed ? 'Stopped. This partial answer has not been checked against its sources.'
                            : 'Stopped.');
    } else {
      note(answer, (streamed ? 'This answer is incomplete. ' : '') + (e.message || String(e)));
    }
  }
  controller = null;
  setBusy(false); qEl.focus();
}

sendEl.onclick = () => busy ? controller?.abort() : ask();
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(); }
});
qEl.addEventListener('input', () => {
  qEl.style.height = 'auto';
  qEl.style.height = Math.min(qEl.scrollHeight, 170) + 'px';
});
qEl.focus();
</script>
